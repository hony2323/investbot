[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investbot-api"
version = "0.1.0"
description = "FastAPI service exposing the investbot advisory engine to the web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "investbot",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["investbot_api*"]
