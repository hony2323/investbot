# Workspace root for the investbot monorepo.
# This file declares no package of its own — it only ties the members together
# so `uv sync` installs the core library and the API app from one place.
#
# Layout:
#   packages/core  -> the `investbot` library + CLI
#   apps/api       -> FastAPI service that wraps the library
#   apps/web       -> React/Vite frontend (its own npm project, not a uv member)

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
investbot = { workspace = true }

# Installed by `uv sync` by default — keeps the dev env test-ready.
[dependency-groups]
dev = ["pytest>=8.0"]
